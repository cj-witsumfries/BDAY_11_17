<title>My Gift To You</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
/* Layout: one column. View 1 is a glowing bouquet drawn in dense glyphs on black.
   View 2 is a ruled sheet of paper that writes the letter in real time, and ends
   with a last flower blooming in a small dark window below the signature.
   Two deliberate looks (night garden, paper letter), so every color is explicit. */
:root {
  --paper: #f1efe9;
  --sheet: #faf8f3;
  --ink: #232a3b;
  --ink-soft: #5b6275;
  --rule: #dcd8cd;
  --rose: #b0485f;
  --night: #0b0a09;
  --night-ink: #efe7d6;
  --night-soft: #a39a86;
  --font-display: 'Newsreader', Georgia, 'Times New Roman', serif;
  --font-hand: 'Mrs Saint Delafield', 'Segoe Script', 'Bradley Hand', cursive;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark light;
}
* { box-sizing: border-box; }
body {
  --bg-now: var(--paper);
  margin: 0;
  background: var(--bg-now);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1rem;
  line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: background-color .7s ease;
}
body.night { --bg-now: var(--night); }
.view { max-width: 760px; margin: 0 auto; animation: fade .9s ease both; }
@keyframes fade { from { opacity: 0; } }

.eyebrow {
  font-family: var(--font-mono); font-size: .75rem; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px;
}
h1 {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: clamp(2rem, 7vw, 3.4rem); line-height: 1.1; margin: 0 0 20px; text-wrap: balance;
}

/* Garden (night) */
#pollen { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#garden { color: var(--night-ink); position: relative; z-index: 1; }
#garden .eyebrow, #garden .hint { color: var(--night-soft); }
.stage { width: 100%; min-width: 0; }
.glyph, .finale { position: relative; }
.glyph { margin: 0 auto; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.glyph canvas, .finale canvas { display: block; position: relative; z-index: 1; }
canvas.glow {
  position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none;
  filter: blur(6px) saturate(1.2) brightness(1.4); opacity: .7;
}
.garden-foot {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 18px 24px; margin-top: 24px;
}
.hint { font-family: var(--font-mono); font-size: .78rem; margin: 0; }
.open {
  font-family: var(--font-display); font-style: italic; font-size: 1.25rem;
  color: var(--ink); text-decoration: none;
  border: 1px solid var(--ink); padding: .65em 1.5em; border-radius: 1px;
  transition: background .2s, color .2s;
}
#garden .open { color: var(--night-ink); border-color: var(--night-ink); }
#garden .open:hover { background: var(--night-ink); color: var(--night); }
.open:focus-visible, .link-btn:focus-visible, .music:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }

/* Letter (paper) */
.letter-wrap { max-width: 640px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 28px; margin: 0 0 20px; }
.controls.bottom { margin: 24px 0 0; }
.link-btn {
  font-family: var(--font-mono); font-size: .78rem; letter-spacing: .06em;
  background: none; border: 0; border-bottom: 1px solid currentColor; border-radius: 0;
  color: var(--ink-soft); padding: 2px 0; cursor: pointer; text-decoration: none;
}
.link-btn:hover { color: var(--ink); }
.sheet {
  --lh: 2.1rem;
  background-color: var(--sheet);
  background-image: repeating-linear-gradient(to bottom,
    transparent 0, transparent calc(var(--lh) - 1px),
    var(--rule) calc(var(--lh) - 1px), var(--rule) var(--lh));
  border: 1px solid var(--rule);
  box-shadow: 0 18px 40px -26px rgba(35, 42, 59, .4);
  padding: var(--lh) clamp(20px, 6vw, 56px) calc(var(--lh) * 2);
  min-height: 70vh;
  font-family: var(--font-hand); font-size: 1.5rem; line-height: var(--lh);
  color: var(--ink); overflow-wrap: anywhere;
}
.sheet p { margin: 0 0 var(--lh); }
.sheet .date { text-align: right; color: var(--ink-soft); }
.sheet .signature { font-weight: 600; margin-bottom: 0; }
.finale { margin: var(--lh) auto 0; background: var(--night); overflow: hidden; line-height: 0; }
.nib {
  display: inline-block; width: 2px; height: 1.1em; background: var(--rose);
  vertical-align: -.15em; margin-left: 1px; animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* Music */
.music {
  position: fixed; z-index: 5;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  font-family: var(--font-mono); font-size: .75rem; letter-spacing: .06em;
  background: var(--bg-now); color: var(--ink-soft);
  border: 1px solid currentColor; padding: 7px 14px; border-radius: 999px;
  cursor: pointer; text-decoration: none; transition: background-color .7s ease;
}
body.night .music { color: var(--night-soft); }
@media (prefers-reduced-motion: reduce) {
  .view { animation: none; }
  .nib { animation: none; }
  body { transition: none; }
}
</style>

<script>
const LETTER = {
  herName: "Althea",                 
  gardenTitle: "My Gift To You",       
  gardenHint: "Tap the bouquet to watch it bloom again.",
  openButton: "Open your letter",

  date: "November 10, 2026",         
  greeting: "My dearest Althea,",

  // One string per paragraph. Add, remove or reorder freely.
  paragraphs: [
    "I love you. I dont think I've said it enough, but even when Im not there, I want you to know how much you mean to me. My days are brighther with you in my life, and I want to spend my time with you. I want to be there for you, to support you, and to make you happy. You make my heart jitter with excitement, and there will never be words to express my love for you.",
    "All of my dreams are a recollection of our moments together. When I first met you, I could not be drawn away from your presence. I was captivated by your beauty, your intelligence, and your kindness. The way you broke bread with a stranger, how you were willing to help me with the most mundane of tasks, and how you made me feel like I was the only person in the world that mattered. I will never forget those moments, and I will always cherish them.",
    "My memories give comfort in light of our physical absence, I hope you have a happy birthday, I cant wait to make more.",
  ],

  closing: "Always yours,",
  signature: "Caleb J.",

};

const SETTINGS = {
  typeSpeedMs: 55,        // average delay per character (lower is faster)
  commaPauseMs: 220,      // pause after , and ;
  sentencePauseMs: 520,   // pause after . ! ?
  blockPauseMs: 800,      // pause between paragraphs
  growthSpeed: 1,         // 1 = normal, 2 = flowers grow twice as fast

  musicFile: "16.Godspeed.mp3",
  musicLink: "https://open.spotify.com/track/34xTFwjPQ1dC6uJmleno7x?si=9b8294ebd21749ed",          // optional fallback: a streaming link she can tap if there is no file
  musicVolume: 0.3,       // 0 to 1

  pollenCount: 70,        // falling pollen specks on the garden page (0 turns it off)
  sway: 1.4,                // how much the flowers sway (0 turns it off, 2 is twice as much)
  bouquetDetail: 1.3,       // 1 = normal, 1.3 = finer characters (heavier on slow phones)
};

/*FLOWERS_BEGIN*/
const FLOWERS = [
  // kind: "bloom" opens from a bud, "bud" stays closed, "leaf" unfolds from its stem, "stem" grows up.
  // delay: the second it starts. The order matches the flower map, so do not reorder without rebuilding.
  { name: "Front bloom", kind: "bloom", delay: 2.2 },
  { name: "Right bloom", kind: "bloom", delay: 3.1 },
  { name: "Left bloom", kind: "bloom", delay: 2.7 },
  { name: "Top bloom", kind: "bloom", delay: 3.5 },
  { name: "Center bud", kind: "bud", delay: 3.9 },
  { name: "Top-left bud", kind: "bud", delay: 4.1 },
  { name: "Top bud", kind: "bud", delay: 4.3 },
  { name: "Upper-right bud", kind: "bud", delay: 4.5 },
  { name: "Right bud", kind: "bud", delay: 4.7 },
  { name: "Left leaf", kind: "leaf", delay: 1.3 },
  { name: "Mid leaf", kind: "leaf", delay: 1.5 },
  { name: "Center leaf", kind: "leaf", delay: 1.7 },
  { name: "Right leaf", kind: "leaf", delay: 1.9 },
  { name: "Small leaf", kind: "leaf", delay: 2.0 },
  { name: "Stems", kind: "stem", delay: 0.0 },
];
/*FLOWERS_END*/

/* The finale rose: its parts, in the same format. */
/*FINALE_BEGIN*/
const FINALE_FLOWERS = [
  // kind: "bloom" opens from a bud, "bud" stays closed, "leaf" unfolds from its stem, "stem" grows up.
  // delay: the second it starts. The order matches the flower map, so do not reorder without rebuilding.
  { name: "Rose", kind: "leaf", delay: 3.0 },
  { name: "Sepals", kind: "leaf", delay: 1.9 },
  { name: "Upper leaf", kind: "leaf", delay: 1.4 },
  { name: "Thin leaves", kind: "leaf", delay: 1.3 },
  { name: "Big leaf", kind: "leaf", delay: 1.3 },
  { name: "Right leaf", kind: "leaf", delay: 1.15 },
  { name: "Left leaves", kind: "leaf", delay: 0.95 },
  { name: "Lower leaves", kind: "leaf", delay: 0.8 },
  { name: "Stem", kind: "stem", delay: 0.0 },
];
/*FINALE_END*/

</script>

<canvas id="pollen" aria-hidden="true" hidden></canvas>

<div id="garden" class="view" hidden>
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="gardenTitle"></h1>
  <div class="stage" id="stage">
    <div class="glyph" id="bouquet" role="img" aria-label="A bouquet of white lisianthus flowers and buds made of colored text characters"></div>
  </div>
  <div class="garden-foot">
    <p class="hint" id="hint"></p>
    <a class="open" id="openBtn" href="#letter"></a>
  </div>
</div>

<div id="letter" class="view letter-wrap" hidden>
  <div class="controls">
    <a class="link-btn" href="#garden">&larr; Back to the garden</a>
    <button class="link-btn" id="skipBtn" type="button">Skip to the end</button>
  </div>
  <article class="sheet" id="sheet" aria-label="Love letter"></article>
  <div class="controls bottom" id="doneBar" hidden>
    <button class="link-btn" id="replayBtn" type="button">Write it again</button>
    <a class="link-btn" href="#garden">&larr; Back to the garden</a>
  </div>
</div>

<button class="music" id="musicBtn" type="button" hidden>&#9834; Music on</button>
<a class="music" id="musicLink" href="#" target="_blank" rel="noopener" hidden>&#9834; Play our song</a>

    });
  }
  if (SETTINGS.musicFile) {
    audio = new Audio();
    audio.loop = true;
    audio.preload = 'auto';
    audio.addEventListener('canplay', function () { musicBtn.hidden = false; setLabel(); }, { once: true });
    audio.addEventListener('error', function () { audio = null; musicBtn.hidden = true; showLink(); });
    audio.src = SETTINGS.musicFile;
  } else {
    showLink();
  }
  var musicStarted = false;
  $('openBtn').addEventListener('click', function () {
    if (audio && !musicStarted) { musicStarted = true; playMusic(); }
  });
  musicBtn.addEventListener('click', function () {
    if (!audio) return;
    musicStarted = true;
    if (audio.paused) { playMusic(); } else { clearInterval(rampTimer); audio.pause(); setLabel(); }
  });

  /* ============ Letter ============ */
  var sheet = $('sheet'), skipBtn = $('skipBtn'), doneBar = $('doneBar');
  var run = 0, skipping = false, finaleStage = null;

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function delayFor(ch) {
    if (ch === ',' || ch === ';' || ch === ':') return SETTINGS.commaPauseMs;
    if (ch === '.' || ch === '!' || ch === '?') return SETTINGS.sentencePauseMs;
    return SETTINGS.typeSpeedMs * (0.6 + Math.random() * 0.8);
  }

  async function playFinale(id) {
    var padL = parseFloat(getComputedStyle(sheet).paddingLeft) || 0;
    var el = document.createElement('div');
    el.className = 'finale';
    el.setAttribute('role', 'img');
    el.setAttribute('aria-label', 'A red rose blooming');
    sheet.appendChild(el);
    var st = new Bloomer({
      host: el, artId: 'finaleArt', mapsId: 'finaleMaps', flowers: FINALE_FLOWERS,
      size: function (availW) { return Math.max(180, Math.min(availW, 300)); },
      fontPx: function () { return 5.4 / (SETTINGS.bouquetDetail || 1); },
      stemSpan: 2.0,
      burst: null
    });
    st.layout(sheet.clientWidth - 2 * padL);
    finaleStage = st;
    st.start(skipping ? 99 : 0);
    if (!skipping) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      var waited = 0, need = st.total() * 1000 / SETTINGS.growthSpeed;
      while (waited < need && !skipping) {
        await wait(100); waited += 100;
        if (id !== run) return;
      }
    }
  }

  async function typeLetter(id) {
    var blocks = [{ cls: 'date', text: LETTER.date }, { cls: 'greeting', text: LETTER.greeting }]
      .concat(LETTER.paragraphs.map(function (t) { return { cls: 'para', text: t }; }))
      .concat([{ cls: 'closing', text: LETTER.closing }, { cls: 'signature', text: LETTER.signature }])
      .filter(function (b) { return b.text; });
    var nib = document.createElement('span');
    nib.className = 'nib';

    function follow() {
      if (skipping) return;
      var r = nib.getBoundingClientRect();
      if (r.bottom > window.innerHeight - 100) {
        window.scrollBy({ top: r.bottom - window.innerHeight + 180, behavior: 'smooth' });
      }
    }

    for (var b = 0; b < blocks.length; b++) {
      if (id !== run) return;
      var el = document.createElement('p');
      el.className = blocks[b].cls;
      sheet.appendChild(el);
      var tn = document.createTextNode('');
      el.appendChild(tn);
      el.appendChild(nib);
      var text = blocks[b].text;
      for (var i = 0; i < text.length; i++) {
        tn.data += text.charAt(i);
        if (!skipping) {
          follow();
          await wait(delayFor(text.charAt(i)));
          if (id !== run) return;
        }
      }
      if (!skipping) await wait(SETTINGS.blockPauseMs);
      if (id !== run) return;
    }
    nib.remove();
    skipBtn.hidden = true;
    await playFinale(id);
    if (id !== run) return;
    doneBar.hidden = false;
  }

  function stopFinale() {
    if (finaleStage) { finaleStage.stop(); finaleStage = null; }
  }
  function startLetter() {
    var id = ++run;
    stopFinale();
    skipping = reduce;
    sheet.replaceChildren();
    doneBar.hidden = true;
    skipBtn.hidden = false;
    typeLetter(id);
  }

  skipBtn.addEventListener('click', function () { skipping = true; });
  $('replayBtn').addEventListener('click', function () { window.scrollTo(0, 0); startLetter(); });

  /* ============ Routing: #letter shows the letter, anything else the garden ============ */
  function route() {
    var isLetter = location.hash === '#letter';
    garden.hidden = isLetter;
    letter.hidden = !isLetter;
    document.body.classList.toggle('night', !isLetter);
    window.scrollTo(0, 0);
    if (isLetter) {
      stopGarden();
      startLetter();
    } else {
      run++;
      stopFinale();
      showGarden();
    }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
